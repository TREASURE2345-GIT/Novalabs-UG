services:
  - type: web
    name: novalab-vr-lab
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: VITE_APP_NAME
        value: NovaLab
      - key: VITE_API_URL
        value: https://api.novalab.ug
      - key: VITE_SITE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: VITE_ENABLE_OFFLINE_MODE
        value: "true"
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GEMINI_MODEL
        value: gemini-2.5-flash
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
