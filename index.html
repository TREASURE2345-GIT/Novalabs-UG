<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/novalab-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NovaLab for Schools - Uganda. Interactive science simulations for Biology, Chemistry, Physics, and Agriculture." />
    <title>NovaLab - For Schools</title>
    <script>
      // The lab ships no service worker. Unregister any stale service worker and
      // clear caches on this origin so a previously cached app shell (e.g. another
      // local PWA served from the same host:port) can never hijack this origin.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) { registration.unregister(); });
        });
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) { caches.delete(key); });
          });
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
